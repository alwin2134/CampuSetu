name: Build and Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create .env file from secrets
        working-directory: ./smart_campus_navigation_system
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
          echo "MAPTILER_API_KEY=${{ secrets.MAPTILER_API_KEY }}" >> .env

      - name: Auto-bump patch version in pubspec.yaml
        id: bump_version
        working-directory: ./smart_campus_navigation_system
        run: |
          CURRENT=$(grep '^version: ' pubspec.yaml | tr -d '\r' | cut -d ' ' -f 2)
          BASE=$(echo $CURRENT | cut -d '+' -f 1)
          MAJOR=$(echo $BASE | cut -d '.' -f 1)
          MINOR=$(echo $BASE | cut -d '.' -f 2)
          PATCH=$(echo $BASE | cut -d '.' -f 3)
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
          BUILD_NUM=${{ github.run_number }}
          sed -i "s/^version: .*/version: ${NEW_VERSION}+${BUILD_NUM}/" pubspec.yaml
          echo "VERSION=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "BUILD_NUM=${BUILD_NUM}" >> $GITHUB_OUTPUT
          echo "Bumped to ${NEW_VERSION}+${BUILD_NUM}"

      - name: Get dependencies
        working-directory: ./smart_campus_navigation_system
        run: flutter pub get

      - name: Build Release APK
        working-directory: ./smart_campus_navigation_system
        run: |
          flutter build apk --release \
            --build-name=${{ steps.bump_version.outputs.VERSION }} \
            --build-number=${{ steps.bump_version.outputs.BUILD_NUM }}

      - name: Rename APK
        run: |
          mv smart_campus_navigation_system/build/app/outputs/flutter-apk/app-release.apk \
             smart_campus_navigation_system/build/app/outputs/flutter-apk/campusetu-v${{ steps.bump_version.outputs.VERSION }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump_version.outputs.VERSION }}+${{ steps.bump_version.outputs.BUILD_NUM }}
          name: "CampuSetu v${{ steps.bump_version.outputs.VERSION }} (Build ${{ steps.bump_version.outputs.BUILD_NUM }})"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: smart_campus_navigation_system/build/app/outputs/flutter-apk/campusetu-v${{ steps.bump_version.outputs.VERSION }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
